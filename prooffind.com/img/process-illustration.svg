<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- Process illustration -->
  <rect width="800" height="400" fill="#f8fafc"/>
  
  <!-- Step 1 -->
  <circle cx="120" cy="200" r="60" fill="white" stroke="#1a56db" stroke-width="3"/>
  <text x="120" y="195" text-anchor="middle" fill="#1a56db" font-size="24" font-weight="bold">1</text>
  <text x="120" y="215" text-anchor="middle" fill="#6b7280" font-size="12">ส่งต้นฉบับ</text>
  
  <!-- Arrow -->
  <path d="M200 200h80" stroke="#e5e7eb" stroke-width="3" stroke-dasharray="8 4"/>
  <polygon points="280,200 270,190 270,210" fill="#e5e7eb"/>
  
  <!-- Step 2 -->
  <circle cx="340" cy="200" r="60" fill="white" stroke="#1a56db" stroke-width="3"/>
  <text x="340" y="195" text-anchor="middle" fill="#1a56db" font-size="24" font-weight="bold">2</text>
  <text x="340" y="215" text-anchor="middle" fill="#6b7280" font-size="12">ตรวจทาน</text>
  
  <!-- Arrow -->
  <path d="M420 200h80" stroke="#e5e7eb" stroke-width="3" stroke-dasharray="8 4"/>
  <polygon points="500,200 490,190 490,210" fill="#e5e7eb"/>
  
  <!-- Step 3 -->
  <circle cx="560" cy="200" r="60" fill="white" stroke="#1a56db" stroke-width="3"/>
  <text x="560" y="195" text-anchor="middle" fill="#1a56db" font-size="24" font-weight="bold">3</text>
  <text x="560" y="215" text-anchor="middle" fill="#6b7280" font-size="12">แก้ไข</text>
  
  <!-- Arrow -->
  <path d="M640 200h80" stroke="#e5e7eb" stroke-width="3" stroke-dasharray="8 4"/>
  <polygon points="720,200 710,190 710,210" fill="#e5e7eb"/>
  
  <!-- Step 4 -->
  <circle cx="780" cy="200" r="60" fill="#1a56db"/>
  <text x="780" y="195" text-anchor="middle" fill="white" font-size="24" font-weight="bold">4</text>
  <text x="780" y="215" text-anchor="middle" fill="white" font-size="12">ส่งงาน</text>
</svg>